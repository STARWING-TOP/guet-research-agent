[project]
name = "guet-research-agent"
version = "0.1.0"
description = "垂域研究助手：ReAct + RAG + 引用"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
    "loguru>=0.7.3",
    "tzdata>=2026.6",
]

[project.optional-dependencies]
# W4 检索层才需要，单独放一个组，免得平时 uv sync 都要拉 2.6GB。
# 安装：uv sync --extra rag   （首次约 2.6GB，建议挂着跑）
rag = [
    "torch>=2.7",
    "sentence-transformers>=3.3",
    "chromadb>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
research-agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

# RTX 5050 是 Blackwell(sm_120)，必须用 cu128 的 PyTorch，
# 装错版本会报 "no kernel image is available for execution on the device"
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
